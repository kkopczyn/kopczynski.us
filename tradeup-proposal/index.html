<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private page</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{--bg:#FAF8F5;--surface:#FFFFFF;--ink:#1B1D1F;--ink2:#3A3E42;--muted:#6B7177;--rule:#E6E1DA;--accent:#B4501E;--accent-soft:#F7EAE2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141516;--surface:#1C1E20;--ink:#EDEBE8;--ink2:#C9C6C1;--muted:#9A9792;--rule:#2E3033;--accent:#E8885A;--accent-soft:#2B1E17;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink2);font:16px/1.6 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:36px 28px;text-align:center}
.card h1{font:600 22px/1.3 "Source Serif 4",Georgia,serif;color:var(--ink);margin:0 0 8px}.card p{color:var(--muted);margin:0 0 20px;font-size:15px}
form{display:flex;flex-direction:column;gap:10px}
input{padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:transparent;color:var(--ink);font-size:16px;text-align:center}
button{padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--surface);font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}.err{color:#c0392b;font-size:14px;min-height:20px;margin-top:10px}
.page{max-width:760px;margin:0 auto;padding-block:48px 80px;display:grid;gap:40px}
.page>*{min-width:0}
.eyebrow{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--accent)}
.hero h1{font:700 clamp(28px,5vw,38px)/1.15 "Source Serif 4",Georgia,serif;color:var(--ink);margin:0;text-wrap:balance}
.by{margin:8px 0 0;color:var(--muted);font-size:15px}
.facts{list-style:none;display:flex;flex-wrap:wrap;gap:8px 24px;margin:20px 0 0;padding:16px 0 0;border-top:1px solid var(--rule);color:var(--muted);font-size:15px}.facts b{color:var(--ink);font-weight:600}
h2{font:600 22px/1.3 "Source Serif 4",Georgia,serif;color:var(--ink);margin:32px 0 10px;text-wrap:balance}
.watch h2{margin-top:0}
video{display:block;width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.vs{margin:8px 0 0;font-size:14px;color:var(--muted)}.vs:empty{display:none}
.cta{margin:16px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}.cta span{font-size:14px;color:var(--muted)}
.btn{display:inline-block;padding:10px 16px;border-radius:8px;background:var(--accent);color:var(--surface);font-weight:600;text-decoration:none;font-size:15px}
.doc p,.doc li{overflow-wrap:anywhere}.doc>:first-child{margin-top:0}.doc a{color:var(--accent)}.doc strong{color:var(--ink);font-weight:600}.doc code{font-size:.9em;overflow-wrap:anywhere}
.doc ul,.doc ol{padding-left:22px}.doc li{margin:6px 0}
.doc .note{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:12px 16px;margin:16px 0}
.weeks td:first-child{white-space:nowrap;color:var(--muted);font-size:14px}.weeks td:nth-child(2){width:130px;color:var(--ink)}.weeks ul{margin:0;padding-left:18px}.weeks li{margin:0 0 5px}.weeks li:last-child{margin-bottom:0}.weeks tr.off td{color:var(--muted);background:var(--accent-soft)}.weeks tr.off td:first-child{padding-left:8px}
.time td span{color:var(--muted);font-size:14px}.time td.n{white-space:nowrap;color:var(--ink);font-weight:600}
@media (max-width:600px){.weeks th:nth-child(2),.weeks td:nth-child(2){width:auto}table{font-size:14px}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;vertical-align:top;padding:9px 12px 9px 0;border-bottom:1px solid var(--rule)}th{color:var(--ink);font-weight:600}
.tech{border-top:1px solid var(--rule);padding-top:20px}summary{cursor:pointer;font:600 20px/1.3 "Source Serif 4",Georgia,serif;color:var(--ink)}.tech .doc{margin-top:16px}.tech h2{font-size:19px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="card">
  <h1>Private page</h1>
  <p>Enter the passcode to continue.</p>
  <form id="gf" autocomplete="off">
    <input id="pw" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Passcode">
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="err" id="err" role="alert"></div>
</div></div>

  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
  async function keyFor(pw){
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  }
  async function video(key){
    var v=document.getElementById("v"),s=document.getElementById("vs");
    try{
      var r=await fetch("walkthrough.enc");if(!r.ok)throw new Error("fetch");
      var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.viv)},key,await r.arrayBuffer());
      v.src=URL.createObjectURL(new Blob([plain],{type:"video/mp4"}));s.textContent="";
    }catch(x){s.textContent="The video didn't load. Refresh the page and enter the passcode again."}
  }
  var f=document.getElementById("gf"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");
  if(!window.crypto||!crypto.subtle){err.textContent="This browser can't open the page. Try a current browser over https."}
  f.addEventListener("submit",async function(ev){
    ev.preventDefault();err.textContent="";go.disabled=true;go.textContent="Unlocking…";
    try{
      var key=await keyFor(pw.value.trim());
      var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct)));
      document.getElementById("gate").outerHTML=html;document.title="TradeUp proposal";window.scrollTo(0,0);video(key);
    }catch(x){go.disabled=false;go.textContent="Unlock";err.textContent="That passcode didn't work.";pw.select()}
  });
  pw.focus();
})();
